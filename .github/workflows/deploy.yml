name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: evechic
  REGION: europe-central2
  SERVICE: evechic-web
  IMAGE: europe-central2-docker.pkg.dev/evechic/cloud-run-source-deploy/evechic-web
  NEXT_PUBLIC_SITE_URL: https://evechic.info
  NEXT_PUBLIC_API_URL: https://api.evechic.info/api
  API_URL: https://evechic-api-589403387980.europe-central2.run.app/api

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npx prettier --check "src/**/*.{ts,tsx,css,json}"

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/589403387980/locations/global/workloadIdentityPools/github/providers/evechic-repo
          service_account: evechic-deployer@evechic.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
      - run: >-
          docker build
          --build-arg NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
          --build-arg NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
          --build-arg API_URL=${{ env.API_URL }}
          -t ${{ env.IMAGE }}:${{ github.sha }} .
      - run: docker push ${{ env.IMAGE }}:${{ github.sha }}
      - run: >-
          gcloud run deploy ${{ env.SERVICE }}
          --image=${{ env.IMAGE }}:${{ github.sha }}
          --region=${{ env.REGION }}
          --project=${{ env.PROJECT_ID }}
          --service-account=evechic-web@evechic.iam.gserviceaccount.com
          --allow-unauthenticated
          --port=8080
          --memory=1Gi
          --cpu=1
          --min-instances=0
          --max-instances=5
          --concurrency=80
          --set-env-vars=NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }},NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }},API_URL=${{ env.API_URL }}
          --quiet
